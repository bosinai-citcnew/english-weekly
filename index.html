<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每週英文教室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Huninn&display=swap">
<style>
/* Direction: a highlighter-pen study notebook. Deep teal hero panels, marker-yellow highlights, coral for TED.
   Layout: left rail on desktop, bottom bar on phone; Today dashboard first; word panel docks right (desktop) or slides up (phone). */
/* Direction: premium language-school feel. Cool paper white, ink type, ultramarine accent, marker-yellow highlight, coral for TED.
   Editorial serif for titles, crisp geometric sans for UI and numbers. Everything sits on one 8px rhythm and shared column edges. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#0e1116; --muted:#667085; --line:#e4e7ec;
  --brand:#2f45ff; --brand-ink:#ffffff; --soft:#eef0ff; --hero:#0e1116; --hero-ink:#ffffff;
  --hi:#ffd84d; --coral:#ff5a3c; --good:#0f8a5f; --bad:#d23f31;
  --f-serif:"Nunito","Huninn",system-ui,sans-serif;
  --f-disp:"Nunito","Huninn",system-ui,sans-serif;
  --f-body:"Nunito","Huninn",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Nunito","Huninn",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --shadow:0 1px 1px rgba(14,17,22,.04),0 6px 20px -6px rgba(14,17,22,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d12; --surface:#141821; --ink:#eef0f5; --muted:#98a2b3; --line:#252b38;
  --brand:#8b9bff; --brand-ink:#0b0d12; --soft:#1b2140; --hero:#161b2e; --hi:#7a6612; --coral:#ff8b72;
  --good:#4cc790; --bad:#ff8379; --shadow:0 1px 1px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#141821; --ink:#eef0f5; --muted:#98a2b3; --line:#252b38;
  --brand:#8b9bff; --brand-ink:#0b0d12; --soft:#1b2140; --hero:#161b2e; --hi:#7a6612; --coral:#ff8b72;
  --good:#4cc790; --bad:#ff8379; --shadow:0 1px 1px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;line-height:1.25;margin:0;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800} h2{font-size:20px;font-weight:800} h3{font-size:16px;font-weight:600}
.shell{min-height:100%;display:grid;grid-template-columns:232px minmax(0,1fr)}
nav.rail{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface);border-right:1px solid var(--line)}
.brand{font:800 20px/1.1 var(--f-disp);padding:2px 12px 18px}
.brand small{display:block;margin-top:6px;font:500 12px var(--f-body);color:var(--muted)}
.brand i{font-style:normal;background:linear-gradient(transparent 58%,var(--hi) 58%);padding:0 3px}
.nb{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;border-radius:12px;text-align:left;color:var(--muted);font-weight:500}
.nb svg{width:21px;height:21px;flex:none}
.nb:hover{background:var(--soft)}
.nb[aria-current="true"]{background:var(--brand);color:var(--brand-ink)}
.rail .sp{flex:1}
.status{font-size:12px;color:var(--muted);padding:8px 14px;line-height:1.6}
main{padding:28px 32px 90px;max-width:940px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--brand);letter-spacing:.04em}
.tag.ted{background:color-mix(in srgb,var(--coral) 16%,var(--surface));color:var(--coral)}
.tag.mine{background:var(--hi);color:#2b2300}
.btn{border:1.5px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 11px;font-size:14px;border-radius:10px}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.ib{border:1.5px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.ib svg{width:18px;height:18px}
.ib:hover{border-color:var(--brand);color:var(--brand)}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:3px 12px;border-radius:99px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,216,77,.28),transparent 68%)}
.hero h1{font-size:30px}
.hero .sub{opacity:.82;margin-top:4px}
.hero .row{margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.13);padding:6px 13px;border-radius:99px;font-weight:600;font-size:14px}
.pill svg{width:18px;height:18px}
.xpbar{height:7px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;width:150px}
.xpbar i{display:block;height:100%;background:var(--hi);border-radius:9px;transition:width .6s}
.ring{position:relative;width:118px;height:118px;z-index:1}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .t{fill:none;stroke:rgba(255,255,255,.2);stroke-width:10}
.ring .p{fill:none;stroke:var(--hi);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 26px var(--f-disp)}
.ring b small{display:block;font:500 11px var(--f-body);opacity:.8;text-align:center;margin-top:-4px}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.goal{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.goal .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.goal.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.goal.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.goal .dot svg{width:15px;height:15px}
.goal small{display:block;color:var(--muted)}
.next{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:20px;border-radius:18px;background:linear-gradient(transparent,transparent),var(--surface);border:1.5px solid var(--brand)}
.wod{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.wod .w1{font:800 30px var(--f-disp)}
.dots{display:flex;gap:8px}
.dots i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 13px var(--f-disp);background:var(--soft);color:var(--muted)}
.dots i.on{background:var(--brand);color:var(--brand-ink)}
.dots i svg{width:15px;height:15px}
/* article cards */
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.acard{position:relative;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px;padding:18px 18px 16px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);min-height:190px}
.acard::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--brand)}
.acard.ted::before{background:var(--coral)} .acard.mine::before{background:var(--hi)}
.acard .num{position:absolute;right:14px;top:8px;font:800 54px/1 var(--f-disp);color:color-mix(in srgb,var(--ink) 7%,transparent)}
.acard:hover{border-color:var(--brand);transform:translateY(-2px)}
.acard .t{font:700 18px/1.3 var(--f-disp);margin-top:6px}
.acard .meta{margin-top:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.acard .ok{color:var(--good);font-weight:700;display:inline-flex;align-items:center;gap:3px}
.acard .ok svg{width:14px;height:14px}
/* reading */
.read{font-family:var(--f-read);font-size:21px;line-height:1.9;max-width:66ch}
.read p{margin:0 0 1.15em}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--hi) 55%,transparent) 58%)}
.w.sel{background:linear-gradient(transparent 40%,var(--hi) 40%)}
.s.on{background:var(--soft);border-radius:5px;box-shadow:0 0 0 4px var(--soft)}
.gl{display:grid;gap:12px}
.gi{border-left:4px solid var(--brand);padding:2px 0 2px 14px}
.gi .ex{font-family:var(--f-read);font-size:16px;color:var(--muted)}
.readbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:10px 0}
.cmp{margin-top:-6px;margin-bottom:18px;padding:14px 16px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.cmp .rs{font-family:var(--f-read);font-size:18px;line-height:1.8}
.blur{filter:blur(7px);user-select:none}
.cl{border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;text-align:center;width:7.5em;border-radius:0}
.cl.ok{border-color:var(--good);color:var(--good)} .cl.no{border-color:var(--bad);color:var(--bad)}
/* word panel */
#wp{position:fixed;z-index:20;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 18px 50px rgba(5,20,35,.3);display:none;overflow:auto}
#wp.open{display:block}
#wp .in{padding:20px;display:flex;flex-direction:column;gap:11px}
@media (min-width:900px){#wp{right:24px;top:24px;width:370px;max-height:calc(100vh - 48px);border-radius:20px}}
@media (max-width:899px){
  .shell{grid-template-columns:1fr}
  nav.rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + var(--safe-b));border-right:0;border-top:1px solid var(--line);z-index:15;justify-content:space-around;gap:2px}
  .brand,.rail .sp,.status{display:none}
  .nb{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;flex:1;align-items:center;text-align:center;border-radius:12px}
  main{padding:16px 16px calc(96px + var(--safe-b))}
  #wp{left:0;right:0;bottom:calc(66px + var(--safe-b));max-height:60vh;border-radius:22px 22px 0 0;border-width:1.5px 0 0}
  .read{font-size:19.5px}
  .hero{grid-template-columns:1fr;padding:20px}
  .hero .ring{position:absolute;right:16px;top:16px;width:84px;height:84px}
  .hero .ring svg{width:84px;height:84px} .hero .ring b{font-size:20px}
  .hero h1{font-size:25px;max-width:62%}
  .goals{grid-template-columns:1fr}
  h1{font-size:25px}
}
.ent .wd{font:700 28px var(--f-read)}
.ent .ipa{color:var(--muted)}
.ent .zh{font-size:21px;font-weight:700}
.ent blockquote{margin:0;padding:6px 12px;border-left:4px solid var(--hi);font-family:var(--f-read);color:var(--muted)}
.gnote{background:var(--soft);border-radius:12px;padding:10px 13px;font-size:14px}
.field{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.field:focus{border-color:var(--brand);outline:none}
textarea.field{min-height:110px;resize:vertical}
/* flashcards */
.fcwrap{perspective:1400px}
.fci{position:relative;min-height:340px;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.fci.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.face .big{font:800 38px/1.15 var(--f-disp)}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .4s}
.bubble{max-width:88%;padding:11px 15px;border-radius:18px 18px 18px 6px;border:1.5px solid var(--line);background:var(--surface)}
.bubble.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:var(--brand);border-radius:18px 18px 6px 18px}
.bubble.me .muted{color:inherit;opacity:.8}
.bubble .who{font-size:12px;opacity:.7;margin-bottom:2px}
.score{font:800 18px var(--f-disp);font-variant-numeric:tabular-nums}
.good{color:var(--good)} .bad{color:var(--bad)}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);margin-top:9px;font-weight:500}
.opt:hover{border-color:var(--brand)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.bars{display:grid;gap:11px}
.bar{display:grid;grid-template-columns:40px 1fr 44px;gap:10px;align-items:center}
.bar .tr{height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--brand);border-radius:9px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--hi);margin:0 4px}
.scen{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.scen .t{font:800 20px var(--f-disp)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;box-shadow:var(--shadow)}
@media (min-width:900px){.toast{bottom:32px;left:calc(50% + 116px)}}
@media (prefers-reduced-motion:no-preference){.acard,.btn,.opt,.goal{transition:border-color .15s,background .15s,transform .15s}}
@media (prefers-reduced-motion:reduce){.fci,.ring .p,.xpbar i,.prog i{transition:none}}
/* ---- v3 polish: shared rhythm, aligned grids, play ---- */
:root{--gap:16px;--pad:20px;--r:18px}
main{padding-top:32px}
.stack{gap:var(--gap)}
.card{padding:var(--pad);border-radius:var(--r)}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
.sh h2{line-height:1.2}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
.alist,.tlist,.badges,.duo{display:grid;gap:var(--gap);align-items:stretch}
.alist,.tlist{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.duo{grid-template-columns:1fr 1fr}
.duo>.card{display:flex;flex-direction:column;gap:10px}
.duo .foot{margin-top:auto;display:flex;gap:10px;align-items:center}
.acard,.tcard,.scen{min-height:200px;padding:var(--pad);border-radius:var(--r)}
.acard .t,.tcard .t{min-height:2.6em}
.tcard{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--coral)}
.tcard .t{font:700 18px/1.3 var(--f-disp);margin-top:6px}
.acts{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:8px}
.acts .btn{justify-content:center;padding:8px 10px;font-size:14px;white-space:nowrap}
.acts .btn.pri{grid-column:1/-1;order:-1}
.scen>.btn:last-child{margin-top:auto;justify-content:center}
.scen .row .btn{flex:1;justify-content:center}
.goal{min-height:68px}
.next{flex-wrap:wrap}
.next>div{flex:1 1 260px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.steps li>span{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:800 15px var(--f-disp)}
.badges{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 10px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);min-height:132px}
.badge .md{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--hi);color:#2b2300}
.badge .md svg{width:22px;height:22px}
.badge b{font-size:14px}
.badge small{color:var(--muted);font-size:12px;line-height:1.4}
.badge.lock{opacity:.5}
.badge.lock .md{background:var(--line);color:var(--muted)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:10px;align-content:start}
.mt{min-height:58px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.mt:hover{border-color:var(--brand)}
.mt.sel{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.mt.done{opacity:.35;box-shadow:none;border-style:dashed}
.mt.wrong{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:60;pointer-events:none;font:800 28px var(--f-disp);color:var(--ink);background:var(--hi);padding:8px 20px;border-radius:99px;box-shadow:var(--shadow);animation:popup 1.1s ease forwards}
@keyframes popup{0%{transform:translate(-50%,10px) scale(.8)}20%{transform:translate(-50%,0) scale(1.08)}100%{transform:translate(-50%,-40px) scale(1);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55;width:100%;height:100%}
.combo{font:800 13px var(--f-disp);background:var(--hi);color:#2b2300;padding:3px 10px;border-radius:99px}
@media (prefers-reduced-motion:no-preference){#view>*{animation:rise .3s ease both}}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
@media (max-width:899px){
  :root{--pad:16px;--gap:14px}
  main{padding-top:18px}
  .duo{grid-template-columns:1fr}
  .acard,.tcard,.scen{min-height:0}
  .acard .t,.tcard .t{min-height:0}
  .steps li{grid-template-columns:32px 1fr}
  .steps li>.btn{grid-column:2;justify-self:start}
  .badges{grid-template-columns:1fr 1fr;gap:10px}
  .badge{min-height:0;padding:12px;display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:0;text-align:left;align-items:center}
  .badge .md{width:40px;height:40px;grid-row:1/3}
  .badge b,.badge small{grid-column:2}
}

/* ---- premium layer ---- */
body{font-size:16px;letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
h1,.hero h1{font-family:var(--f-serif);font-weight:400;letter-spacing:-.01em;line-height:1.1}
h1{font-size:40px} .hero h1{font-size:44px}
h2{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:-.015em}
h1 em,.hero h1 em{font-style:italic;color:var(--brand)}
.hero h1 em{color:var(--hi)}
.brand{font:400 26px/1 var(--f-serif);letter-spacing:-.01em;padding:4px 14px 22px}
.brand i{font-style:italic;background:linear-gradient(transparent 62%,var(--hi) 62%)}
.brand small{font-family:var(--f-disp);letter-spacing:.02em}
nav.rail{gap:4px}
.nb{font-weight:600;border-radius:999px;padding:10px 16px}
.nb[aria-current="true"]{background:var(--ink);color:var(--bg)}
.card,.acard,.tcard,.scen,.goal,.badge,.mt,.face{border-width:1px}
.btn{border-radius:999px;border-width:1px;padding:9px 18px;font-weight:700;font-size:15px;letter-spacing:-.005em}
.btn.sm{padding:6px 13px;font-size:13.5px;border-radius:999px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:none}
.btn.pri:hover{filter:none;background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip{border-width:1px;font-weight:600}
.field{border-width:1px;border-radius:14px}
.tag{border-radius:6px;padding:3px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.hero{background:radial-gradient(90% 120% at 100% 0%,color-mix(in srgb,var(--brand) 70%,transparent),transparent 60%),radial-gradient(60% 90% at 0% 100%,color-mix(in srgb,var(--coral) 35%,transparent),transparent 60%),var(--hero);border-radius:28px;padding:32px}
.hero::after{display:none}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.acard .t,.tcard .t{font:400 24px/1.15 var(--f-serif);letter-spacing:-.005em}
.acard .num{font:400 56px/1 var(--f-serif);font-style:italic;color:color-mix(in srgb,var(--ink) 9%,transparent);top:12px;right:16px}
.acard::before,.tcard::before{height:4px}
.acard:hover,.tcard:hover{transform:translateY(-3px);box-shadow:0 2px 2px rgba(14,17,22,.04),0 18px 36px -12px rgba(14,17,22,.18)}
.wod .w1{font:400 44px/1 var(--f-serif)}
.face .big{font:400 48px/1.1 var(--f-serif)}
.ent .wd{font:400 34px/1.1 var(--f-serif)}
.scen .t{font:400 28px/1.1 var(--f-serif)}
.score{font-family:var(--f-disp)}
.label{font-family:var(--f-disp)}
.read{font-size:21px}
.quota{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.quota .q-n{font:800 22px var(--f-disp);font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.quota .q-bar{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.quota .q-bar i{display:block;height:100%;border-radius:9px;background:var(--good)}
.quota.low .q-bar i{background:#e0a100} .quota.out .q-bar i{background:var(--bad)}
.quota .q-t{font-size:13px;color:var(--muted);line-height:1.4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:899px){h1{font-size:32px}.hero h1{font-size:34px;max-width:64%}.hero{padding:22px}.acard .t,.tcard .t{font-size:22px}.quota{flex-wrap:wrap}.quota .q-bar{flex-basis:100%;order:3}}

/* ---- rounded type ---- */
body{font-weight:500;letter-spacing:0}
h1,.hero h1{font-weight:900;letter-spacing:-.01em;line-height:1.15}
h1{font-size:36px} .hero h1{font-size:40px}
h1 em,.hero h1 em{font-style:normal}
.brand{font:900 24px/1.1 var(--f-disp)}
.brand i{font-style:normal}
.acard .t,.tcard .t{font:800 20px/1.3 var(--f-disp)}
.acard .num{font:900 50px/1 var(--f-disp);font-style:normal}
.wod .w1{font:900 38px/1.1 var(--f-disp)}
.face .big{font:900 42px/1.15 var(--f-disp)}
.ent .wd{font:900 30px/1.15 var(--f-disp)}
.scen .t{font:900 24px/1.2 var(--f-disp)}
.read{font-weight:500;font-size:20px;line-height:1.85}
.cmp .rs,.gi .ex,.ent blockquote{font-weight:500}
.muted,.small{font-weight:500}
.btn,.nb,.chip,.seg button{font-weight:800}
@media (max-width:899px){h1{font-size:30px}.hero h1{font-size:32px}.acard .t,.tcard .t{font-size:19px}.read{font-size:19px}}
.welcome{position:fixed;inset:0;z-index:70;background:rgba(10,12,18,.55);display:grid;place-items:center;padding:16px}
.welcome .box{background:var(--surface);color:var(--ink);border-radius:26px;max-width:460px;width:100%;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:calc(100% - 32px);overflow:auto}
.welcome h2{font-size:26px;font-weight:900}
.wsteps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.wsteps li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.wsteps .md{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--brand)}
.wsteps .md svg{width:20px;height:20px}
.wsteps b{display:block}

/* ---- conversation alignment ---- */
.btn{min-height:44px;justify-content:center} .btn.sm{min-height:34px}
.field{min-height:44px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .btn,.scen>.btn{white-space:nowrap}
.scen{gap:14px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ctl3{grid-template-columns:repeat(3,1fr)}
.ctl .btn{white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.inrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:stretch}
.inrow .field{min-width:0}
.chat{display:flex;flex-direction:column;gap:12px}
.bubble{width:min(78%,560px);max-width:none;padding:14px 18px}
.bubble .who{font-size:12px;font-weight:800;opacity:.75;margin-bottom:4px}
.bubble .who span{font-weight:600;opacity:.8;margin-left:4px}
.bubble .en{font-size:17px;line-height:1.5}
.bubble .zh{font-size:14px;opacity:.75;margin-top:4px}
.bubble .sc{font-size:13px;font-weight:800;margin-top:6px}
.turn .line{font-size:24px;font-weight:700;line-height:1.4}
@media (max-width:899px){.bubble{width:88%}.turn .line{font-size:21px}.ctl3 .btn{padding:8px 6px;font-size:14px}}

/* ---- layout review fixes ---- */
.btn{white-space:nowrap;flex-shrink:0}
.inrow{display:flex;gap:10px;align-items:stretch}
.inrow .field{flex:1;min-width:0}
.shell{background:linear-gradient(to right,var(--surface) 232px,var(--bg) 232px)}
.wrow{display:flex;align-items:center;gap:14px;padding:14px 18px}
.wtxt{flex:1;min-width:0}
.wact{display:flex;gap:8px;flex:none}
.mt{font-weight:600;font-size:17px}
.cl{min-width:4ch;max-width:100%}
@media (min-width:900px){
  body.wp-open main{max-width:calc(100vw - 232px - 420px)}
}
@media (max-width:899px){
  .shell{background:var(--bg)}
  .quota{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
  .quota>div:first-child{grid-column:1/-1}
  .quota .q-bar{grid-column:1/-1;order:0}
  .quota .q-n{text-align:left;order:1}
  .quota .seg{order:2;justify-self:end}
}

.hintlist{display:grid;gap:8px}
.hint{text-align:left;padding:11px 14px;border:1px dashed var(--brand);border-radius:14px;background:var(--soft);color:var(--ink);font-weight:600;font-size:15px}
.hint:hover{border-style:solid}

.srcgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
@media (max-width:899px){.srcgrid{grid-template-columns:1fr}}

.lvcard{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px}
.airow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}

.notice{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--good) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 40%,transparent);font-weight:600}
.notice svg{width:18px;height:18px;flex:none;color:var(--good)}
.notice.wait{background:var(--soft);border-color:var(--line)}
.pastebox textarea{min-height:200px}
.pastebox{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:899px){.grid2{grid-template-columns:1fr}}
.steps li>.row{justify-self:end}
</style>
</head>

 "countries have made too many promises and kept too few"}], "questions": [{"q": "Where is COP31 this month?", "opts": ["Taiwan", "Antalya, Turkey", "Paris, France"], "a": 1}, {"q": "Why is the Earth getting warmer?", "opts": ["People burn coal, oil and gas.", "There are too many trees.", "The sun is closer."], "a": 0}, {"q": "What do some people say about promises?", "opts": ["Countries kept all of them.", "Countries made too many and kept too few.", "Countries made no promises."], "a": 1}], "keySentences": [{"s": "The Earth is getting warmer because people burn coal, oil and gas.", "target": "warmer"}, {"s": "Many people hope the meeting will bring real action.", "target": "action"}], "targetWords": ["climate", "energy", "promise"]}, {"id": "a2", "kind": "news", "title": "China's New Electric Plane Completes a Test Flight", "zh": "中國新型電動飛機完成載人試飛", "source": {"name": "NewsBytes, Science & Technology", "url": "https://www.newsbytesapp.com/news/science/969"}, "note": "依本週科技新聞改寫成 A2-B1 學習文章，非原文。", "paras": ["China's new electric airplane has completed a flight with a pilot on board. The plane can carry 19 passengers, and the test went well.", "Electric planes use batteries instead of fuel. This means they make less noise and less pollution. One day, they may fly short trips between small cities or islands.", "However, batteries are heavy, and they cannot store as much energy as fuel. Because of this, electric planes cannot fly very far yet. Engineers are working hard to build better batteries."], "glossary": {"electric": {"pos": "adjective", "ipa": "/ɪˈlek.trɪk/", "zh": "電動的、電的", "def": "using or produced by electricity", "ex": "My brother has an electric car.", "g": "electric 是形容詞，放在名詞前：an electric plane（注意冠詞用 an）。"}, "battery": {"pos": "noun", "ipa": "/ˈbæt̬.ɚ.i/", "zh": "電池", "def": "a small object that gives power to a phone, car or toy", "ex": "My phone battery is low.", "g": "複數：battery → batteries（子音 + y 變 ies）。"}, "fuel": {"pos": "noun", "ipa": "/ˈfjuː.əl/", " function isoWeek(d=new Date()){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+'-W'+String(Math.ceil(((t-y0)/DAY+1)/7)).padStart(2,'0');
}

const norm = s => String(s).toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
function similarity(target, said){
  const a=norm(target), b=norm(said); if(!a.length||!b.length) return 0;
  const bag={}; b.forEach(x=>bag[x]=(bag[x]||0)+1);
  let hit=0; a.forEach(x=>{if(bag[x]>0){hit++;bag[x]--}});
  const p=hit/b.length, r=hit/a.length; return p+r? 2*p*r/(p+r):0;
}

/* ---------- remote sync ---------- */
function snapRows(snap){
  if(!snap) return [];
  if(Array.isArray(snap)) return snap.map(d=>({id:d.id,...(d.data?d.data():d)}));
  const docs = snap.docs || [];
  if(docs.length) return docs.map(d=>({id:d.id,...(d.data?d.data():d)}));
  const out=[]; if(typeof snap.forEach==='function') snap.forEach(d=>out.push({id:d.id,...(d.data?d.data():d)})); return out;
}
const rpath = k => `data/users/${S.uid}/${k}`;
async function rset(path,obj){ if(!S.db||!S.uid) return; try{ await S.db.doc(path).set(obj) }catch(e){ S.syncState='同步失敗' } }
async function rdel(path){ if(!S.db||!S.uid) return; try{ await S.db.doc(path).delete() }catch(e){} }
async function initCaps(){
  const get = async n => { try{ return await claude.use(n) }catch(e){ return null } };
  if(!window.claude){ render(); return; }
  const [db,user,sample,tts,dict] = await Promise.all(['db','user','sample','tts','dictation'].map(get));
  S.sample=sample; S.tts=tts; S.dict=dict;
  if(dict){
    dict.onPartial(({text})=>{ if(dictSink) dictSink((dictAcc+' '+text).trim(),false) });
    dict.onFinal(({text})=>{ dictAcc=(dictAcc+' '+text).trim(); if(dictSink) dictSink(dictAcc,true) });
    dict.onState(({state})=>{ if(state==='idle'&&dictDone){const f=dictDone;dictDone=null;f(dictAcc.trim())} });
  }
  if(db&&user){
    S.db=db;
    try{ S.uid = await user.id() }catch(e){ S.uid=null }
    if(S.uid){
      S.syncState='雲端同步';
      try{
        const doc = await db.doc('content/current').get();
        const data = doc && (typeof doc.data==='function'? doc.data(): doc);
        const exists = doc && (typeof doc.exists==='function'? doc.exists(): doc.exists);
        if(data && data.weekId && data.articles && (exists!==false) && data.weekId >= S.week.weekId){ S.week=data; }
      }catch(e){}
      try{
        const rows = snapRows(await db.collection(rpath('words')).get());
        rows.forEach(r=>{ const k=r.id; const loc=S.words[k]; if(!loc || (r.updated||0)>(loc.updated||0)) S.words[k]={...r}; });
        Object.entries(S.words).forEach(([k,v])=>{ if(!rows.find(r=>r.id===k)) rset(rpath('words/'+k),v) });
        lset('ell.words',S.words);
      }catch(e){ S.syncState='本機' }
      try{
        const rows = snapRows(await db.collection(rpath('quizzes')).get());
        rows.forEach(r=>{ const {id,...rest}=r; S.quizHist[id]=rest; }); lset('ell.quiz',S.quizHist);
      }catch(e){}
      try{
        const rows = snapRows(await db.collection(rpath('mine')).get());
        rows.forEach(r=>{ if(!S.mine.find(m=>m.id===r.id)) S.mine.push({...r}) });
        S.mine.forEach(m=>{ if(!rows.find(r=>r.id===m.id)) rset(rpath('mine/'+m.id),m) });
        S.mine.sort((a,b)=>b.created-a.created); lset('ell.mine',S.mine);
      }catch(e){}
      try{
        const doc = await db.doc(rpath('stats/main')).get();
        const data = doc && (typeof doc.data==='function'? doc.data(): doc);
        if(data && data.days){
          const st=S.stats; st.xp=Math.max(st.xp||0,data.xp||0);
          Object.entries(data.days).forEach(([d,v])=>{ const a=st.days[d]||{}; Object.keys(v).forEach(k=>{ if(typeof v[k]==='number') a[k]=Math.max(a[k]||0,v[k]) }); st.days[d]=a });
          st.done={...(data.done||{}),...st.done}; st.badges={...(data.badges||{}),...(st.badges||{})};
          if(data.best) st.best=Math.min(st.best||999,data.best); lset('ell.stats',st);
        }
      }catch(e){}
    }
  }
  const cur=isoWeek();
  S.weekNote = S.week.weekId===cur ? '' : `目前內容是 ${S.week.weekId} 週，本週新文章還在準備中。`;
  render();
}

function cleanTranscript(raw){
  const lines=String(raw).replace(/\r/g,'').split('\n').map(s=>s.trim()); const out=[]; let cur=[];
  const flush=()=>{ if(cur.length){ out.push(cur.join(' ').replace(/\s+/g,' ')); cur=[] } };
  const ends=()=>cur.length&&/[.!?"”]$/.test(cur[cur.length-1]);
  for(const l of lines){
    if(!l){ flush(); continue }
    if(/^\(?\d{1,2}:\d{2}(:\d{2})?\)?$/.test(l)){ if(ends()) flush(); continue }
    if(/^\d+\s*(hours?|minutes?|seconds?)(,?\s*\d+\s*(minutes?|seconds?))*$/i.test(l)) continue;
    if(/^[\[(](music|applause|laughter|音樂|掌聲|笑聲)[\])]$/i.test(l)) continue;
    if(/^(transcript|read transcript|show transcript|english|english \(auto-generated\)|search in video|chapters?|transcript \(english\)|轉錄稿|顯示轉錄稿)$/i.test(l)) continue;
    cur.push(l.replace(/^\d{1,2}:\d{2}(:\d{2})?\s*/,''));
  }
  flush();
  const res=[];
  for(const p of out){
    if(!/[A-Za-z]{2}/.test(p)) continue;
    const words=p.split(/\s+/);
    if(words.length<=110){ res.push(p); continue }
    const sents=p.split(/(?<=[.!?])\s+/);
    if(sents.length<3){ for(let i=0;i<words.length;i+=60) res.push(words.slice(i,i+60).join(' ')); continue }
    let buf=[],n=0; for(const s of sents){ buf.push(s); n+=s.split(/\s+/).length; if(n>=70){ res.push(buf.join(' ')); buf=[]; n=0 } } if(buf.length) res.push(buf.join(' '));
  }
  return res.join('\n\n');
}

const GM=['gemini-flash-latest','gemini-2.5-flash','gemini-flash-lite-latest'];

const mkErr=(code)=>{ const e=new Error(code); e.code=code; return e };
async function gemini(prompt){
  let last='upstream_error';
  for(const m of GM){
    let r;
    try{ r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':gkey()},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:.6,responseMimeType:'application/json'}})}) }
    catch(e){ throw mkErr('upstream_error') }
    if(r.status===429) throw mkErr('rate_limited');
    if(r.status===401||r.status===403) throw mkErr('bad_key');
    if(r.status===400){ let b=''; try{ b=await r.text() }catch(e){} if(/API key|API_KEY/i.test(b)) throw mkErr('bad_key'); last='upstream_error'; continue }
    if(!r.ok){ last='upstream_error'; continue }
    const d=await r.json(); const txt=(((d.candidates||[])[0]||{}).content||{parts:[]}).parts.map(p=>p.text||'').join('');
    const s=txt.indexOf('{'), e=txt.lastIndexOf('}'); if(s<0||e<s){ last='invalid_json'; continue }
    try{ return JSON.parse(txt.slice(s,e+1)) }catch(err){ last='invalid_json' }
  }
  throw mkErr(last);
}
async function ask(prompt){
  if(!aiOn()) throw new Error('nosample');
  if(Q.left()<=0){ const e=new Error('budget'); e.code='budget'; throw e }
  try{ const r=S.sample? await S.sample.json(prompt,{modelTier:'quick',cache:false}) : await gemini(prompt); Q.limited=false; today().ai=(today().ai||0)+1; saveStats(); refreshQuota(); return r }
  catch(e){ if(e&&e.code==='rate_limited'){ Q.limited=true; refreshQuota() } else if(e&&e.code!=='cancelled'&&e.code!=='not_granted'){ today().ai=(today().ai||0)+1; saveStats(); refreshQuota() } throw e }
}

function allGloss(){ const g={}; (S.week.articles||[]).forEach(a=>Object.entries(a.glossary||{}).forEach(([k,v])=>{ if(!g[k]) g[k]={...v,src:a.title} })); return g }
function lemmaCandidates(w){
  w=w.toLowerCase().replace(/['’]s$/,''); const c=[w];
  if(w.endsWith('ies')) c.push(w.slice(0,-3)+'y');
  if(w.endsWith('es')) c.push(w.slice(0,-2));
  if(w.endsWith('s')) c.push(w.slice(0,-1));
  if(w.endsWith('ed')) c.push(w.slice(0,-2),w.slice(0,-1));
  if(w.endsWith('ing')) c.push(w.slice(0,-3),w.slice(0,-3)+'e');
  if(w.endsWith('er')) c.push(w.slice(0,-2),w.slice(0,-1));
  if(w.endsWith('ly')) c.push(w.slice(0,-2));
  if(/(.)\1(ed|ing)$/.test(w)) c.push(w.replace(/(.)\1(ed|ing)$/,'$1'));
  return c;
}
function localEntry(w){ const g=allGloss(); for(const c of lemmaCandidates(w)){ if(g[c]) return {word:c,...g[c],from:'article'} } return null }
async function lookup(w,sentence){
  const key=w.toLowerCase();
  const l=localEntry(key); if(l) return l;
  if(S.cache[key]) return S.cache[key];
  const p=`You are writing a learner dictionary entry in the style of the Cambridge Learner's Dictionary for a Traditional Chinese speaker at CEFR A2-B1.
Word the learner tapped: "${w}"${sentence?`\nSentence it appeared in: "${sentence.slice(0,300)}"`:''}
Reply with JSON only, no code fence:
{"word":"base form of the word","pos":"part of speech in English","ipa":"US IPA with slashes","zh":"簡短繁體中文意思（依句子語境）","def":"one simple English definition using easy words","ex":"one short natural example sentence","g":"用繁體中文 1-2 句說明這個字在句中的文法（詞性變化、時態、常見搭配或句型）","level":"CEFR level such as A2"}
If the input is not a real English word, return {"error":"not a word"}.`;
  const r = await ask(p);
  if(!r||r.error) throw new Error('notword');
  const e={...r,from:'ai'}; S.cache[key]=e; return e;
}

let readGen=0;
async function readAll(){
  if(!S.sents||!S.sents.length) return;
  const g=++readGen; stopSpeak();
  S.reading=true;
  for(let i=0;i<S.sents.length;i++){
    const el=S.sents[i];
    if(g!==readGen){ S.reading=false; return }
    $$('.s.on').forEach(x=>x.classList.remove('on')); el.classList.add('on'); el.scrollIntoView({block:'center',behavior:'smooth'});
    await say(el.textContent.trim());
    if(S.redo&&g===readGen){ S.redo=false; i--; }
  }
  S.reading=false;
  if(g===readGen){ $$('.s.on').forEach(x=>x.classList.remove('on')); toast('朗讀完畢，記得按「讀完了」領 XP') }
}
function stopRead(){ readGen++; stopSpeak(); $$('.s.on').forEach(x=>x.classList.remove('on')) }

  else { r.box=1; r.due=Date.now()+10*60*1000; f.again++; f.combo=0; f.q.push(k) }

async function startChat(title,scenario){
  S.conv={mode:'chat',title,scenario,msgs:[],busy:true}; render();
  try{
    const r=await ask(`You are role-playing with an English learner (CEFR ${lv().cefr}, Traditional Chinese speaker). Scenario: ${scenario}. You play the other person. Speak first with ONE line (max ${lv().words} words, level ${lv().cefr}) that starts the scene and asks a question.
JSON only: {"reply":"your line"}`);
    S.conv.msgs.push({role:'assistant',content:r.reply});
  }catch(e){ S.conv.msgs.push({role:'assistant',content:errMsg(e)+' 可以先回到情境列表，用劇本跟讀練習。'}) }
  S.conv.busy=false; render(); const m=S.conv.msgs[S.conv.msgs.length-1]; if(m&&!/[\u4e00-\u9fff]/.test(m.content)) say(m.content);
}
async function sendChat(text){
  const c=S.conv; if(!text.trim()||c.busy) return;
  c.msgs.push({role:'user',content:text.trim()}); c.busy=true; render(); track('talk',1,3,true);
  const hist=c.msgs.map(m=>`${m.role==='user'?'Learner':'You'}: ${m.content}`).join('\n');
  try{
    const r=await ask(`You are role-playing with an English learner (CEFR ${lv().cefr}, Traditional Chinese speaker). Scenario: ${c.scenario}. Stay in the role. Keep replies under ${lv().words} words at level ${lv().cefr}${S.level==='hard'?', speak naturally, common idioms are fine, and ask follow-up questions that need longer answers':' with simple words'}, and move the scene forward with a question or next step. If the scene reaches a natural end, say goodbye.
Conversation so far:
${hist}
Check the learner's LAST message. JSON only: {"reply":"your next line in English","fix":"若有文法或用字錯誤，用繁體中文一兩句說明並給出更自然的說法（附英文）；如果沒有錯誤，回覆空字串"}`);
    c.msgs[c.msgs.length-1].fix=r.fix||''; c.msgs.push({role:'assistant',content:r.reply});
  }catch(e){ c.msgs.push({role:'assistant',content:errMsg(e)}) }
  c.busy=false; render(); const m=c.msgs[c.msgs.length-1]; if(!/[\u4e00-\u9fff]/.test(m.content)) say(m.content);
  setTimeout(()=>{const i=$('#cin'); i&&i.focus({preventScroll:true})},50);
}

function simStart(id){
  const sc=SIM[id], meta=SCEN.find(s=>s.id===id);
  S.conv={mode:'sim',id,sc,title:meta.title,node:'n1',log:[],miss:0,turns:0,done:false,hints:false,zh:S.level==='easy',lvl:S.level};
  const n=sc.nodes.n1; S.conv.log.push({p:1,en:n.say,zh:n.zh}); render(); toTop(); say(n.say,{rate:lv().rate});
}
function simSend(txt){
  const c=S.conv; txt=String(txt||'').trim(); if(!txt||c.done) return;
  const node=c.sc.nodes[c.node], low=' '+txt.toLowerCase().replace(/[’]/g,"'")+' ';
  let hit=node.x.find(e=>e.k.test(low)); if(!hit&&node.any&&/[a-z]/i.test(txt)) hit={to:node.any};
  const u={p:0,en:txt}; c.log.push(u);
  const L=LV[c.lvl];
  if(hit&&txt.split(/\s+/).filter(Boolean).length<L.min){
    c.miss++; const m={en:"Could you say that in a full sentence, please?",zh:`請用完整的句子回答（${L.n}至少 ${L.min} 個字）。`};
    c.log.push({p:1,...m}); render(); say(m.en,{rate:L.rate}); return;
  }
  if(!hit){
    c.miss++; c.hints=c.miss>=L.hintAfter&&L.hintAfter<9;
    const m=c.miss>1?{en:"Sorry, I don't understand. Try one of the hints below.",zh:"不好意思，我聽不太懂。試試下面的提示說法。"}:{en:"Sorry, could you say that again?",zh:"不好意思，可以再說一次嗎？"};
    c.log.push({p:1,...m}); render(); say(m.en,{rate:L.rate}); return;
  }
  c.miss=0; c.turns++; c.hints=false; track('talk',1,3,true);
  if(c.lvl!=='hard'&&txt.split(/\s+/).length<4&&node.hints[0]&&similarity(node.hints[0],txt)<.7) u.tip=node.hints[0];
  const out=[]; if(hit.r) out.push({p:1,en:hit.r,zh:hit.rz||''});
  if(hit.to==='END'){ c.done=true; if(!hit.r) out.push({p:1,en:"Thank you! Goodbye!",zh:"謝謝，再見！"}) }
  else if(hit.to!==c.node||!hit.r){ c.node=hit.to; const n=c.sc.nodes[c.node]; out.push({p:1,en:n.say,zh:n.zh}) }
  c.log.push(...out); render(); say(out.map(o=>o.en).join(' '),{rate:L.rate});
  if(c.done){ track('talk',0,c.lvl==='hard'?30:c.lvl==='mid'?20:15); confetti() }
  setTimeout(()=>{const i=$('#sin'); i&&i.focus({preventScroll:true})},60);
}
function simView(c){
  const n=c.sc.nodes[c.node];
  const L=LV[c.lvl], canHint=c.miss>=L.hintAfter;
  const log=c.log.map(m=>m.p?`<div class="bubble"><div class="who">${c.sc.who}</div><div class="en">${esc(m.en)}</div>${m.zh&&c.zh?`<div class="zh">${esc(m.zh)}</div>`:''}</div>`
    :`<div class="bubble me"><div class="who">你</div><div class="en">${esc(m.en)}</div>${m.tip?`<div class="gnote" style="margin-top:8px;color:var(--ink)">也可以說完整一點：${esc(m.tip)}</div>`:''}</div>`).join('');
  const tail=c.done?`<div class="card stack"><h2>對話完成</h2><div>${L.n}：你完成了 ${c.turns} 次回答，+${c.lvl==='hard'?30:c.lvl==='mid'?20:15} XP。${c.lvl==='hard'?'很厲害！':'練熟了可以挑戰更高難度。'}</div><div class="ctl"><button class="btn pri" data-a="sim" data-id="${c.id}">再練一次</button><button class="btn" data-a="convend">回到情境</button></div></div>`
   :`<div class="card stack" style="gap:12px"><div class="inrow"><input id="sin" class="field" placeholder="用英文回答（打字或按麥克風）" autocomplete="off" aria-label="你的回答">${canListen()?`<button class="btn" data-a="simmic" aria-label="說話">${ic('mic')}</button>`:''}<button class="btn pri" data-a="simsend">送出</button></div>
      <div class="row between"><span class="small muted">${canHint?'不知道怎麼說？點提示會填進輸入框':`${L.n}：答錯 ${L.hintAfter} 次後才能看提示`}</span><button class="btn sm" data-a="simhints" aria-pressed="${c.hints}" ${canHint?'':'disabled'}>${c.hints?'收起提示':'看提示'}</button></div>
      ${c.hints&&canHint?`<div class="hintlist">${n.hints.map(h=>`<button class="hint" data-a="simhint" data-t="${esc(h)}">${esc(h)}</button>`).join('')}</div>`:''}</div>`;
  return `<div class="stack"><div class="row between"><button class="btn sm" data-a="convend">${ic('back')}情境列表</button><b>${esc(c.title)}・模擬對話</b></div>

   <div class="chat">${log}</div>${tail}</div>`;

/* quiz */
function buildQuiz(){
  const A=S.week.articles; const ks=[];
  for(let r=0;r<2;r++) A.forEach(a=>{ const k=(a.keySentences||[])[r]; if(k) ks.push({...k,art:a.title}) });
  const listen=ks.slice(0,5).map(k=>({t:'listen',...k}));
  const speak=A.slice(1,4).map(a=>(a.keySentences||[])[1]||(a.keySentences||[])[0]).filter(Boolean).map(k=>({t:'speak',...k}));
  const qs=[]; for(let r=0;r<3;r++) A.forEach(a=>{ const q=(a.questions||[])[r]; if(q) qs.push({...q,art:a.title}) });
  const read=qs.slice(0,5).map(q=>({t:'read',...q}));
  const tw=A.flatMap(a=>a.targetWords||[]);
  const write=[{t:'write',kind:'words',words:[tw[0],tw[4]||tw[1]].filter(Boolean)},{t:'write',kind:'opinion',title:(A[3]||A[0]).title}];
  return [{id:'listen',name:'聽力',desc:'聽句子，把空格的字打出來',items:listen},{id:'speak',name:'口說',desc:'聽示範，再大聲唸出來',items:speak},{id:'read',name:'閱讀',desc:'依本週文章回答問題',items:read},{id:'write',name:'寫作',desc:'用本週單字寫句子，Claude 批改',items:write}];
}

  }

   :`<div class="row"><button class="btn pri" data-a="qcheck">${aiOn()?'送出批改':'完成'}</button></div>`}</div>`;
}
function qPoint(sec,v){ const q=S.qz; (q.pts[sec]=q.pts[sec]||[]).push(v) }
function qNext(){
  const q=S.qz; q.res=null; const sec=q.secs[q.si];
  if(q.ii+1<sec.items.length){ q.ii++ } else {
    const arr=q.pts[sec.id]||[]; q.scores[sec.id]=arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/sec.items.length):0;

  }
  render();
}
function finishQuiz(){
  const q=S.qz; q.done=true; const tot=Math.round(Object.values(q.scores).reduce((a,b)=>a+b,0)/4);

      }catch(e){
        const used = it.kind==='words' ? it.words.filter(w=>new RegExp(w,'i').test(txt)).length/it.words.length : Math.min(1,txt.split(/\s+/).length/20);
        res={score:Math.round(40+used*50),fb:errMsg(e)+' 這是依字數與單字使用估算的分數。'};
      }
      q.res=res; qPoint('write',res.score); render();
    }
  },
  qnext(){ qNext() },
  addmiss(){ let n=0; S.qz.missed.forEach(w=>{ const e=localEntry(w); if(e&&addWord(e)) n++ }); toast(n?`已加入 ${n} 個單字`:'已經在單字本了') }
};
document.addEventListener('click',e=>{ const t=e.target.closest('[data-a]'); if(!t) return; const f=ACT[t.dataset.a]; if(f){ e.preventDefault(); f(t,e) } });
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.w,.fci')){ e.preventDefault(); e.target.click() }
  if(e.key==='Enter'&&e.target.id==='cin'){ e.preventDefault(); ACT.csend() }
  if(e.key==='Enter'&&e.target.id==='sin'){ e.preventDefault(); ACT.simsend() }
  if(e.key==='Enter'&&e.target.id==='qin'&&e.target.tagName==='INPUT'){ const b=$('[data-a=qcheck]'); if(b&&!b.hidden) b.click() }
});
document.addEventListener('submit',e=>{ if(e.target.id==='lf'){ e.preventDefault(); doLook($('#lq').value) } });
document.addEventListener('input',e=>{
  if(e.target.id==='wfilter') wlistFilter(e.target.value.trim().toLowerCase());
  if(e.target.id==='ix'){ const pe=parseEll(e.target.value); if(pe){ e.target.value=pe.text; if(!$('#it').value) $('#it').value=pe.title.slice(0,120); if(!$('#iu').value) $('#iu').value=pe.url; toast('已自動帶入標題和網址') }
    const c=cleanTranscript(e.target.value); const ps=c?c.split('\n').length:0, ws=c?c.split(/\s+/).length:0; $('#icount').textContent=ws?`偵測到 ${ps} 段、約 ${ws} 字，約 ${Math.max(1,Math.round(ws/120))} 分鐘讀完`:'還沒有內容' }
});

function welcome(){
  if(lget('ell.welcomed',false)) return;
  const el=document.createElement('div'); el.className='welcome'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','歡迎');
  const step=(i,b,s)=>`<li><span class="md">${ic(i)}</span><div><b>${b}</b><span class="small muted">${s}</span></div></li>`;
  el.innerHTML=`<div class="box"><div><div class="label">歡迎使用</div><h2>每週英文教室</h2><p class="lede" style="margin-top:4px">適合 A2–B1 程度，每天 10 分鐘就好。每週一自動換新文章。</p></div>
   <ul class="wsteps">${step('read','讀文章，點單字就查','每週 3 篇時事、1 篇 TED，可以整篇朗讀')}${step('cards','收進單字本，用字卡複習','還有計時的單字配對小遊戲')}${step('chat','開口練會話','點餐、問路、飯店、購物、看醫生，模擬對話或跟著唸')}${step('quiz','週末做週測驗','聽、說、讀、寫各一關')}</ul>
   <div class="small muted">${window.claude?'':'這個版本完全免費，不需要任何帳號。讀文章、朗讀、本週單字、字卡、配對遊戲、模擬對話、跟讀和週測驗都能用，進度存在這台裝置。想像 App 一樣使用，可以用瀏覽器的「加入主畫面」。'}</div>
   <div class="small muted" ${window.claude?'':'hidden'}>不用登入、不用訂閱，讀文章、朗讀、本週單字、字卡、配對遊戲、會話跟讀和週測驗都能用，進度存在這台裝置。登入 Claude 後，單字本會跨裝置同步，也能查任何單字、和 Claude 自由對話、批改寫作。想像 App 一樣使用，可以用瀏覽器的「加入主畫面」。</div>
   <button class="btn pri" style="justify-content:center" data-a="welcomeok">開始學習</button></div>`;
  document.body.appendChild(el); setTimeout(()=>{const b=el.querySelector('button'); b&&b.focus()},50);
}
ACT.welcomeok=()=>{ lset('ell.welcomed',true); const w=$('.welcome'); w&&w.remove() };
async function loadWeekFile(){
  try{ const r=await fetch('week.json',{cache:'no-store'}); if(!r.ok) return; const d=await r.json();
    if(d&&d.weekId&&Array.isArray(d.articles)&&d.articles.length&&d.weekId>S.week.weekId){ S.week=d; S.weekNote = d.weekId===isoWeek()?'':S.weekNote; render() } }catch(e){}
}
window.addEventListener('message',e=>{
  const m=e.data; if(!m||m.type!=='ell-import'||typeof m.text!=='string') return;
  try{ e.source&&e.source.postMessage('ell-ack','*') }catch(err){}
  const w=$('.welcome'); if(w){ lset('ell.welcomed',true); w.remove() }
  S.tab='read'; S.art=null; S.importing={title:String(m.title||'').slice(0,120),url:/^https?:/.test(m.url||'')?String(m.url):'',text:cleanTranscript(m.text).slice(0,30000),from:hostOf(m.url||'')};
  render(); toTop(); const ix=$('#ix'); if(ix) ix.dispatchEvent(new Event('input',{bubbles:true}));
});
if(location.hash==='#import'&&!window.claude){ S.tab='read'; S.importing={waiting:true}; lset('ell.welcomed',true) }
render();
welcome();
loadWeekFile();
initCaps();
</script>
